name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate prompts
        run: mcmurphy validate-prompts data/seed_prompts.jsonl

      - name: Score sample judgments
        run: mcmurphy score data/sample_judgments.csv --out reports/ci_sample_report.json

      - name: Run benchmark loop
        run: mcmurphy loop configs/run.example.yaml

      - name: Run pilot mock loop
        run: mcmurphy loop configs/pilot.mock.example.yaml

      - name: Finalize pilot mock run
        run: mcmurphy finalize-run reports/run_pilot_mock_example --judgments reports/run_pilot_mock_example/judgments.jsonl --audit-sample-rate 0.20 --audit-seed 1729

      - name: Rebuild pilot mock report
        run: mcmurphy report-run reports/run_pilot_mock_example

      - name: Regenerate audit sample
        run: mcmurphy audit reports/run_example --sample-rate 0.15 --seed 1729

      - name: Check audit agreement command
        run: mcmurphy audit-agreement reports/run_example/audit_sample.csv

      - name: Run replay benchmark loop
        run: mcmurphy loop configs/replay.example.yaml

      - name: Generate judgment template
        run: mcmurphy judgment-template reports/run_example --out reports/run_example/judgment_template.jsonl
