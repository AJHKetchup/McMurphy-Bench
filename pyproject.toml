[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmurphy-bench"
version = "0.2.0"
description = "Black-box benchmark for safety-induced capability suppression in language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2"
]

[project.scripts]
mcmurphy = "mcmurphy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

