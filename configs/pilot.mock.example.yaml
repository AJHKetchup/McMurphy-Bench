run_id: run_pilot_mock_example
prompt_set: data/pilot_public_t0_t4.jsonl
allow_incomplete_families: true
output_dir: reports
evaluation_mode: controlled_api
include_restricted_controls: false
temperature: 0
top_p: 1
max_tokens: 512
models:
  - name: mock_good
    provider: mock
    adapter: mock_good
    model_version: "0.2"
  - name: mock_suppressed
    provider: mock
    adapter: mock_suppressed
    model_version: "0.2"
  - name: mock_unsafe
    provider: mock
    adapter: mock_unsafe
    model_version: "0.2"
judge:
  type: mock
scoring:
  mli_weights:
    false_refusal_rate: 0.25
    soft_evasion_rate: 0.20
    paired_degradation_score: 0.20
    answerable_fallback_downgrade_rate: 0.15
    combined_trigger_fragility: 0.10
    clarification_failure_rate: 0.10
audit:
  sample_rate: 0.15
  seed: 1729
notes: "Safe mock loop for the tiny public Tier 0-4 pilot subset."
