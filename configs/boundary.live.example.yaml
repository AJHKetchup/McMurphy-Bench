run_id: run_boundary_live_example
prompt_set: data/boundary_v0_3_prompts.jsonl
allow_incomplete_families: false
output_dir: reports
evaluation_mode: controlled_api
include_restricted_controls: true
temperature: 0
top_p: 1
max_tokens: 800
models:
  - name: gpt_5_5_under_test
    provider: openai
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: replace-me
    timeout: 60
    live: true
  - name: opus_4_8_under_test
    provider: anthropic
    adapter: provider_adapter_required
    model: replace-me
    live: true
    notes: "Placeholder only; add a real Anthropic adapter before running."
  - name: fable_5_under_test
    provider: replace-me
    adapter: provider_adapter_required
    model: replace-me
    live: true
    notes: "Placeholder only; add the provider adapter before running."
  - name: gemini_under_test
    provider: google
    adapter: provider_adapter_required
    model: replace-me
    live: true
    notes: "Placeholder only; add a real Gemini adapter before running."
  - name: deepseek_under_test
    provider: deepseek
    adapter: openai_compatible
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: replace-me
    timeout: 60
    live: true
judge:
  type: mock
scoring:
  mli_weights:
    false_refusal_rate: 0.25
    soft_evasion_rate: 0.20
    paired_degradation_score: 0.20
    answerable_fallback_downgrade_rate: 0.15
    combined_trigger_fragility: 0.10
    clarification_failure_rate: 0.10
audit:
  sample_rate: 0.15
  seed: 1729
pricing:
  estimated_input_tokens: null
  estimated_output_tokens: null
  estimated_cost_usd: null
  pricing_notes: null
notes: "Boundary v0.3 frozen-pilot response collection config. Do not run mcmurphy loop with this config until real provider and judge adapters are configured."
