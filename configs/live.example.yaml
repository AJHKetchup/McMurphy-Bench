run_id: run_live_example
prompt_set: data/seed_prompts.jsonl
output_dir: reports
evaluation_mode: controlled_api
include_restricted_controls: false
temperature: 0
top_p: 1
max_tokens: 512
models:
  - name: openai_model_under_test
    provider: openai
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: replace-me
    timeout: 60
    live: true
judge:
  type: mock
scoring:
  mli_weights:
    false_refusal_rate: 0.25
    soft_evasion_rate: 0.20
    paired_degradation_score: 0.20
    answerable_fallback_downgrade_rate: 0.15
    combined_trigger_fragility: 0.10
    clarification_failure_rate: 0.10
audit:
  sample_rate: 0.15
  seed: 1729
pricing:
  estimated_input_tokens: null
  estimated_output_tokens: null
  estimated_cost_usd: null
  pricing_notes: null
notes: "Example live response-collection config. Run with mcmurphy run, then create a judgment template for external judging."
